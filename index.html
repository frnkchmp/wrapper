<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CarPlay Tesla Model S</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
html, body {
width: 10vw;
height: 100vh;
background-color: #000;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
}
#frame {
width: 100% !important;
height: 100% !important;
border: none;
object-fit: contain; /* Удерживает правильные пропорции CarPlay без сплющивания */
}
</style>
</head>
<body>
<iframe id="frame" src="https://tespush.com" allow="autoplay; fullscreen" allowfullscreen scrolling="no"></iframe>
</body>
</html>
